<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Banque Bernard &amp; Cie</title>
<meta name="description" content="Banque Bernard & Cie, banquiers privés. Genève · Boston. Depuis 1788.">
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;1,400&display=swap" rel="stylesheet">
<style>
  :root {
    --paper: #f4efe4;
    --ink: #1b1a17;
    --ink-soft: #5a564d;
    --rule: #b08d3c;
  }
  html, body { margin: 0; padding: 0; height: 100%; }
  body {
    background: var(--paper);
    color: var(--ink);
    font-family: "Cormorant Garamond", Garamond, "Times New Roman", serif;
    -webkit-font-smoothing: antialiased;
    display: flex;
    flex-direction: column;
    min-height: 100vh;
    min-height: 100dvh;
  }
  main {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 3rem 1rem;
    gap: 0;
  }
  h1 {
    margin: 0;
    font-weight: 400;
    font-size: clamp(1.9rem, 6.5vw, 3.2rem);
    letter-spacing: 0.16em;
    text-transform: uppercase;
    line-height: 1.15;
  }
  h1 small {
    display: block;
    font-size: 0.42em;
    letter-spacing: 0.34em;
    margin-top: 0.7rem;
    color: var(--ink-soft);
  }
  .rule {
    width: 3.5rem;
    height: 1px;
    background: var(--rule);
    margin: 1.8rem auto;
  }
  .places {
    font-size: clamp(1rem, 3.2vw, 1.25rem);
    letter-spacing: 0.3em;
    text-transform: uppercase;
    color: var(--ink-soft);
    margin: 0;
  }
  .year {
    margin: 0.9rem 0 0;
    font-size: clamp(0.95rem, 3vw, 1.15rem);
    letter-spacing: 0.2em;
    color: var(--rule);
  }
  .notice {
    margin: 2.6rem 0 0;
    font-style: italic;
    font-size: clamp(1.15rem, 3.8vw, 1.5rem);
    line-height: 1.5;
  }
  .notice span {
    display: block;
    font-style: normal;
    font-size: 0.78em;
    letter-spacing: 0.08em;
    color: var(--ink-soft);
    margin-top: 0.35rem;
  }
  footer {
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: 0.6rem 3.5rem;
    padding: 1.6rem 1rem 2.2rem;
    font-size: 0.98rem;
    letter-spacing: 0.06em;
    color: var(--ink-soft);
    line-height: 1.6;
  }
  footer address { font-style: normal; }
  @media (prefers-color-scheme: dark) {
    :root { --paper: #15140f; --ink: #ece5d3; --ink-soft: #a39b88; --rule: #c9a44a; }
  }
</style>
</head>
<body>
<main>
  <h1>Banque Bernard <small>&amp; Cie</small></h1>
  <div class="rule" role="presentation"></div>
  <p class="places">Genève &nbsp;·&nbsp; Boston</p>
  <p class="year">MDCCLXXXVIII</p>
  <p class="notice">La maison ne reçoit que sur introduction.
    <span lang="en">The house receives by introduction only.</span></p>
</main>
<footer>
  <address>Rue de la Corraterie 32<br>1204 Genève</address>
  <address>340 State Street<br>Boston, Mass. 02109</address>
</footer>
</body>
</html>
